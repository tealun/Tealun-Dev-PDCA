name: suite package

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dev-pdca.zip matches the skill sources
        run: python3 scripts/build_suite.py --check
      - name: evolution ledger IDs are unique
        run: python3 scripts/check_ledger.py
