name: plugin branch

# The Claude plugin directory tracks the `plugin` branch, which holds only the built
# plugin (skills, plugin.json, README, LICENSE, icon) and none of the repository's
# tooling. This workflow is the only writer of that branch, and it only writes a tag
# that already has a GitHub Release:
#   - called by release.yml after its release job succeeds (needs: release);
#   - run by hand with an existing release tag, to refill the branch.
# See docs/88_planning/plugin-branch-20261105.md and release-gate-20261105.md.

on:
  workflow_call:
    inputs:
      tag:
        description: "release tag, e.g. v1.0.1"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "an existing release tag, e.g. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: plugin-branch
  cancel-in-progress: false

jobs:
  publish:
    # run the workflow definition from main or a release tag, never from a feature branch
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: the tag must already have a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --json tagName --jq .tagName
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: plugin checks for this tag
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/build_plugin.py --check --tag "$TAG"
      - name: build the plugin
        run: python3 scripts/build_plugin.py
      - name: validate the built plugin with the Claude Code CLI
        run: npx -y @anthropic-ai/claude-code@2.1.318 plugin validate dist/tealun-dev-pdca/.claude-plugin/plugin.json
      - name: commit the built plugin to the plugin branch
        run: scripts/publish_plugin_branch.sh dist/tealun-dev-pdca plugin
